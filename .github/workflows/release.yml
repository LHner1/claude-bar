name: Release

# Push a tag like v1.0.0 to build a universal ClaudeBar.zip, publish it as a GitHub release
# and update the Homebrew cask in LHner1/homebrew-tap.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build universal app
        env:
          CLAUDEBAR_VERSION: ${{ github.ref_name }}
        run: ./scripts/build-app.sh --arch arm64 --arch x86_64

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent ClaudeBar.app ClaudeBar.zip
          shasum -a 256 ClaudeBar.zip | tee ClaudeBar.zip.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ClaudeBar.zip build/ClaudeBar.zip.sha256 \
            --title "ClaudeBar $GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256="$(cut -d' ' -f1 build/ClaudeBar.zip.sha256)"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" packaging/homebrew/claude-bar.rb \
            | grep -v '^# ' > claude-bar.rb
          { echo '### Homebrew cask'; echo '```ruby'; cat claude-bar.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::notice::HOMEBREW_TAP_DEPLOY_KEY is not set. Copy the cask from the job summary to LHner1/homebrew-tap/Casks/claude-bar.rb."
            exit 0
          fi
          # Write-enabled deploy key of LHner1/homebrew-tap; GitHub's host keys come from its API.
          SSH_DIR="$RUNNER_TEMP/tap-ssh"
          mkdir -m 700 "$SSH_DIR"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$SSH_DIR/key"
          chmod 600 "$SSH_DIR/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$SSH_DIR/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $SSH_DIR/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts"

          git clone git@github.com:LHner1/homebrew-tap.git tap
          mkdir -p tap/Casks
          cp claude-bar.rb tap/Casks/claude-bar.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/claude-bar.rb
          git diff --cached --quiet || { git commit -m "claude-bar $VERSION"; git push; }
